name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar APK (Visor SL)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v4

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar el APK de depuracion
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Compilar tambien el APK de release (firmado con la clave de depuracion)
        run: gradle assembleRelease --no-daemon
        continue-on-error: true

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: visor-sl-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
